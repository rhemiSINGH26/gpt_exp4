<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personalized Recommendation System</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>🤖 Personalized Recommendation System</h1>
            <p>Get learning recommendations based on your interests and goals</p>
        </div>

        <div class="card">

            <h2>👤 User Profile</h2>

            <div class="form-grid">

                <div>
                    <label>Name</label>
                    <input type="text" id="name" placeholder="Enter your name">
                </div>

                <div>
                    <label>Age</label>
                    <input type="number" id="age" placeholder="Enter your age">
                </div>

                <div>
                    <label>Field</label>
                    <input type="text" id="field" placeholder="Computer Science">
                </div>

                <div>
                    <label>Interests</label>
                    <input type="text" id="interests"
                           placeholder="AI, Python, Java">
                </div>

                <div>
                    <label>Skill Level</label>

                    <select id="skill_level">
                        <option>Beginner</option>
                        <option>Intermediate</option>
                        <option>Advanced</option>
                    </select>
                </div>

                <div>
                    <label>Preferred Learning Type</label>

                    <select id="learning_type">
                        <option>Practical</option>
                        <option>Theoretical</option>
                        <option>Both</option>
                    </select>
                </div>

            </div>

            <label>🎯 Learning Goal</label>

            <textarea id="goal"
                      placeholder="Example: Learn Artificial Intelligence"></textarea>

            <button onclick="getRecommendations()">
                ✨ Generate Recommendations
            </button>

        </div>


        <div id="loading" class="loading">
            Analyzing your preferences...
        </div>


        <div id="results" class="card results">

            <h2>🎓 Personalized Recommendations</h2>

            <div id="recommendationList"></div>

        </div>


        <div id="feedbackSection" class="card feedback">

            <h2>💬 Recommendation Feedback</h2>

            <p>
                Want better recommendations?
                Tell us what you are more interested in.
            </p>

            <textarea id="feedback"
                      placeholder="Example: I am more interested in Java than Web Development"></textarea>

            <button onclick="updateRecommendations()">
                🔄 Update Recommendations
            </button>

        </div>

    </div>

    <script src="/static/script.js"></script>

</body>

</html>
